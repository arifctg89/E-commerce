    <div class="contact-container flex-center">
          <form action="" class="form card" method="post">
            <div class="form-control flex-center">
              <label for="name">Name </label>
              <input type="text" id="full_name" name="full_name" required>
            </div>

            <div class="form-control flex-center">
              <label for="email">Email </label>
              <input type="email" id="email" name="email" required>
            </div>

            <div class="form-control flex-center">
              <label for="massage">Massage</label>
              <input type="text" id="massage" name="massage" required>
            </div>

            <div class="form-control flex-center">
              <button type="submit" class="btn contact-btn">Submit</button>
            </div>
          </form>
          <div class="contact-address flex-space-araound">
            <address>
              <h4>Address:</h4>
              <p>123 high street</p>
              <p>Bakalia, Chattogram</p>
              <span>Call:</span><a href="tel:+123456789">+123456789</a>
            </address>
