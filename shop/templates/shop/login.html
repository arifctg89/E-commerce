{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- for search engine optimization or accesable -->
    <meta name="description" content="This is an Ecommerce Project">
    <title>Ecommerce Project</title>
        <!-- css styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- font awesome cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
body {
  font-family: Arial, Helvetica, sans-serif;
}

* {
  box-sizing: border-box;
}

/* style the container */
.container {
  position: relative;
  border-radius: 5px;
  background-color: #f2f2f2;
  padding: 20px 0 30px 0;
} 

/* style inputs and link buttons */
input,
.btn_login {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 4px;
  margin: 5px 0;
  opacity: 0.85;
  display: inline-block;
  font-size: 17px;
  line-height: 20px;
  text-decoration: none; /* remove underline from anchors */
}

input:hover,
.btn_login:hover {
  opacity: 1;
}

/* add appropriate colors to fb, twitter and google buttons */
.fb {
  background-color: #3B5998;
  color: white;
}

.twitter {
  background-color: #55ACEE;
  color: white;
}

.google {
  background-color: #dd4b39;
  color: white;
}

/* style the submit button */
input[type=submit] {
  background-color: #04AA6D;
  color: white;
  cursor: pointer;
}

input[type=submit]:hover {
  background-color: #45a049;
}

/* Two-column layout */
.col {
  float: left;
  width: 50%;
  margin: auto;
  padding: 0 50px;
  margin-top: 6px;
}

/* Clear floats after the columns */
.row:after {
  content: "";
  display: table;
  clear: both;
}

/* vertical line */
.vl {
  position: absolute;
  left: 50%;
  transform: translate(-50%);
  border: 2px solid #ddd;
  height: 175px;
}

/* text inside the vertical line */
.vl-innertext {
  position: absolute;
  top: 50%;
  transform: translate(-50%, -50%);
  background-color: #f1f1f1;
  border: 1px solid #ccc;
  border-radius: 50%;
  padding: 8px 10px;
}

/* hide some text on medium and large screens */
.hide-md-lg {
  display: none;
}

/* bottom container */
.bottom-container {
  text-align: center;
  background-color: #666;
  border-radius: 0px 0px 4px 4px;
  width: 94%;
  display: block;
  margin: auto;
}

/* Responsive layout - when the screen is less than 650px wide, make the two columns stack on top of each other instead of next to each other */
@media screen and (max-width: 650px) {
  .col {
    width: 100%;
    margin-top: 0;
  }
  /* hide the vertical line */
  .vl {
    display: none;
  }
  /* show the hidden text on small screens */
  .hide-md-lg {
    display: block;
    text-align: center;
  }
}
</style>


</head>
<body>
 
    <i class="fas fa-bars fa-2x" id="menu-icon"></i>
    <nav id="menu" class="hidden">
        <ul class="nav_upper flex-space-around">
            <li class="nav_list"><a href="" class="nav_link"><img class="profile-icon" src="{% static '/shop/images/logo.png' %}" alt="profile icon"></a></li>
            <li class="nav_list"><a href="" class="nav_link">Welcome To AR Express</a></li>
            <li class="nav_list"><a href="/register/" class="nav_link">Register</a></li>
        </ul>
    </nav>
    <main>
  <div class="container">
    <div class="row">
      <h2 style="text-align:center">Login with Social Media or Manually</h2>
      <div class="vl">
        <span class="vl-innertext">or</span>
      </div>
 
      <div class="col">
        <a href="#" class="fb btn_login">
          <i class="fa fa-facebook fa-fw"></i> Login with Facebook
        </a>
        <a href="#" class="twitter btn_login">
          <i class="fa fa-twitter fa-fw"></i> Login with Twitter
        </a>
        <a href="#" class="google btn_login">
          <i class="fa fa-google fa-fw"></i> Login with Google+
        </a>
      </div>
 
      <div class="col">
        <div class="hide-md-lg">
          <p>Or sign in manually:</p>
        </div>
        <section class="login">
            <div class="card">
              <form action="" class="form" method="post">
                {% csrf_token %}
                
                <div class="form-control flex-center">
                  <label for="email">Email </label>
                  <input type="email" id="email" name="email" required>
                </div>
 
                <div class="form-control flex-center">
                  <label for="password">Password</label>
                  <input type="password" id="password" name="password" required>
                </div>
 
                <div class="form-control flex-center">
                  <button style="background-color: #3B5998; color: white;" type="submit" class="btn_login contact-btn_login">Login</button>
                </div>
              </form>
            </div>
        </section>
      </div>
    </div>
    <div class="bottom-container">
        <div class="row">
          <div class="col">
            <a href="/register/" style="color:white" class="btn_login">Sign up</a>
          </div>
          <div class="col">
            <a href="#" style="color:white" class="btn_login">Forgot password?</a>
          </div>
        </div>
    </div>
  </div>
</main>

    <script>
        const menuIcon = document.getElementById
        ("menu-icon");
        const menu = document.getElementById("menu");

        menuIcon.addEventListener("click",()=>{
            if(menu.className === "hidden"){
                menu.classList.remove("hidden");
            } else {
                menu.classList.add("hidden");
            }
        })
    </script>
    {% include 'shop/footer.html' %}
